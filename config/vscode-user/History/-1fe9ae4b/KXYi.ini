# Fuzzel Configuration - Glassy Dark Theme

[main]
font=FiraCode Nerd Font:weight=bold:size=10
dpi-aware=no
# Ensure terminal-launched commands from Fuzzel use X11 auth when needed.
terminal=env DISPLAY=:0 XAUTHORITY=/home/brenden/.Xauthority alacritty -e
prompt="❯ "
icon-theme=Adwaita
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=20
lines=8
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0a0a0fe6
text=f8f8f2ff
match=8be9fdff
selection=8be9fdff
selection-text=0a0a0fff
selection-match=0a0a0fff
# border=8be9fdff

# [border]
# width=1
# radius=12

[dmenu]
mode=text  # text | index
exit-immediately-if-empty=no
