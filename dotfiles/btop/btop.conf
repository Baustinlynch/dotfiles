# btop configuration file
# This is a starter config - btop will update it on first run

[main]
# Update time in milliseconds
update_ms=2000

# Log level (0=off, 1=error, 2=warn, 3=info, 4=debug)
log_level=2

# Show average CPU in CPU box
show_cpu_avg=true

# Show detailed CPU info
show_cpu_info=true

# Draw clock in top right
draw_clock=true

# 24 hour clock format
clock_format=24h

# Theme
color_theme="Default"

# Rounded boxes
rounded_boxes=true

[processes]
# Show process tree
tree_view=false

# Show process command line
show_cmdline=true

# Sort by CPU usage
sorting="cpu"

# Reverse sort
sorting_reverse=true

# Filter
filter=""

# Show kernel threads
show_threads=false

# Show processes of current user only
user_processes=false

[cpu]
# Show CPU temperature
show_temp=true

# Show CPU frequency
show_freq=true

# Show CPU usage per core
per_core=true

[mem]
# Show memory details
show_mem_details=true

[net]
# Show network upload/download
show_download=true
show_upload=true

[disks]
# Show disk read/write
show_read=true
show_write=true

[temp]
# Show temperatures
show_cpu_temp=true
show_gpu_temp=true
